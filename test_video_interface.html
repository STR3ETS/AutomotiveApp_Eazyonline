<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Interface Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-6">🎬 Video Interface Test</h1>
    
    <div class="grid grid-cols-2 gap-4 max-w-4xl">
        <!-- Test Video 1 -->
        <div class="relative group">
            <div class="bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                <div class="relative aspect-video bg-gray-200">
                    <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" 
                         alt="Test YouTube Video"
                         class="w-full h-full object-cover">
                    
                    <!-- Play Button -->
                    <button onclick="event.stopPropagation(); playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'Test YouTube Video')"
                            class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-0 hover:bg-opacity-30 transition-all duration-200 z-[5]"
                            title="Video afspelen">
                        <div class="bg-red-600 rounded-full p-4 text-white opacity-90 hover:opacity-100 transform scale-100 hover:scale-110 transition-all duration-200 shadow-lg">
                            <i class="fa-solid fa-play text-2xl ml-1"></i>
                        </div>
                    </button>
                    
                    <!-- Action Buttons -->
                    <div class="absolute top-2 right-12 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">
                        <div class="flex gap-1">
                            <button class="bg-yellow-600 hover:bg-yellow-700 text-white p-1.5 rounded-full shadow-lg" title="Maak featured">
                                <i class="fa-solid fa-star text-xs"></i>
                            </button>
                            <button class="bg-blue-600 hover:bg-blue-700 text-white p-1.5 rounded-full shadow-lg" title="Bewerken">
                                <i class="fa-solid fa-edit text-xs"></i>
                            </button>
                            <button class="bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-lg" title="Verwijderen">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Platform Badge -->
                    <div class="absolute top-2 right-2 bg-gray-800 bg-opacity-75 text-white text-xs px-2 py-1 rounded">
                        YouTube
                    </div>
                </div>
                
                <div class="p-4">
                    <h3 class="font-semibold text-gray-900 text-sm mb-1">Test YouTube Video</h3>
                    <p class="text-gray-600 text-xs mb-2">Dit is een test YouTube video</p>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span class="bg-gray-100 px-2 py-1 rounded">Overview</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Test Video 2 -->
        <div class="relative group">
            <div class="bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                <div class="relative aspect-video bg-gray-200">
                    <img src="https://i.vimeocdn.com/video/540659059_640x360.jpg" 
                         alt="Test Vimeo Video"
                         class="w-full h-full object-cover">
                    
                    <!-- Play Button -->
                    <button onclick="event.stopPropagation(); playVideo('https://player.vimeo.com/video/148751763', 'Test Vimeo Video')"
                            class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-0 hover:bg-opacity-30 transition-all duration-200 z-[5]"
                            title="Video afspelen">
                        <div class="bg-red-600 rounded-full p-4 text-white opacity-90 hover:opacity-100 transform scale-100 hover:scale-110 transition-all duration-200 shadow-lg">
                            <i class="fa-solid fa-play text-2xl ml-1"></i>
                        </div>
                    </button>
                    
                    <!-- Action Buttons -->
                    <div class="absolute top-2 right-12 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">
                        <div class="flex gap-1">
                            <button class="bg-blue-600 hover:bg-blue-700 text-white p-1.5 rounded-full shadow-lg" title="Bewerken">
                                <i class="fa-solid fa-edit text-xs"></i>
                            </button>
                            <button class="bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-lg" title="Verwijderen">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Featured Badge -->
                    <div class="absolute top-2 left-2 bg-red-600 text-white text-xs px-2 py-1 rounded">
                        <i class="fa-solid fa-star mr-1"></i>
                        Featured
                    </div>
                    
                    <!-- Platform Badge -->
                    <div class="absolute top-2 right-2 bg-gray-800 bg-opacity-75 text-white text-xs px-2 py-1 rounded">
                        Vimeo
                    </div>
                </div>
                
                <div class="p-4">
                    <h3 class="font-semibold text-gray-900 text-sm mb-1">Test Vimeo Video</h3>
                    <p class="text-gray-600 text-xs mb-2">Dit is een test Vimeo video</p>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span class="bg-gray-100 px-2 py-1 rounded">Exterior</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Video Player Modal -->
    <div id="videoPlayerModal" class="fixed inset-0 bg-black bg-opacity-95 z-[99999] hidden" onclick="closeVideoPlayer()">
        <div class="relative w-full h-full flex items-center justify-center p-4" onclick="event.stopPropagation()">
            <button onclick="closeVideoPlayer()" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 bg-black bg-opacity-70 rounded-full w-12 h-12 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
            <div class="w-full max-w-5xl">
                <div id="videoPlayerContainer" class="relative aspect-video bg-black rounded-lg overflow-hidden shadow-2xl">
                    <!-- Video will be inserted here -->
                </div>
                <div class="text-center mt-4">
                    <h2 id="videoPlayerTitle" class="text-white text-xl font-semibold">Video Title</h2>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Test Controls -->
    <div class="mt-8 p-4 bg-white rounded-lg border">
        <h2 class="text-lg font-semibold mb-3">🧪 Test Controls</h2>
        <div class="space-x-2">
            <button onclick="testVideoPlayer()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Test YouTube Video
            </button>
            <button onclick="playVideo('https://player.vimeo.com/video/148751763', 'Test Vimeo Video')" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                Test Vimeo Video
            </button>
            <button onclick="forceCloseModal()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                Force Close Modal
            </button>
        </div>
        <p class="text-sm text-gray-600 mt-2">
            Open browser console (F12) om debug informatie te zien tijdens het testen.
        </p>
    </div>

    <script>
        // Video Player Functions
        function playVideo(embedUrl, title) {
            console.log('🎬 playVideo called with:', embedUrl, title);
            
            // Stop event propagation to prevent conflicts
            event?.stopPropagation();
            
            const modal = document.getElementById('videoPlayerModal');
            const container = document.getElementById('videoPlayerContainer');
            const titleElement = document.getElementById('videoPlayerTitle');
            
            console.log('📍 Modal elements found:', {
                modal: !!modal,
                container: !!container, 
                titleElement: !!titleElement
            });
            
            if (!modal || !container) {
                console.error('❌ Missing critical modal elements');
                alert('Video player niet gevonden. Probeer de pagina te verversen.');
                return;
            }
            
            // Clear previous content
            container.innerHTML = '';
            
            // Create iframe for video
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.className = 'w-full h-full border-0';
            iframe.allowFullscreen = true;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            
            console.log('🎥 Created iframe with src:', embedUrl);
            
            container.appendChild(iframe);
            
            if (titleElement) {
                titleElement.textContent = title || 'Video';
            }
            
            // Show modal with multiple methods to ensure visibility
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            modal.style.visibility = 'visible';
            modal.style.opacity = '1';
            modal.style.zIndex = '99999';
            
            document.body.style.overflow = 'hidden';
            
            console.log('✅ Modal should now be visible');
            console.log('📊 Modal final styles:', {
                display: modal.style.display,
                visibility: modal.style.visibility,
                opacity: modal.style.opacity,
                zIndex: modal.style.zIndex,
                classes: modal.className
            });
        }

        function closeVideoPlayer() {
            console.log('🔴 Closing video player');
            
            const modal = document.getElementById('videoPlayerModal');
            const container = document.getElementById('videoPlayerContainer');
            
            if (!modal || !container) {
                console.error('❌ Modal elements not found during close');
                return;
            }
            
            // Clear video content to stop playback
            container.innerHTML = '';
            
            // Hide modal completely
            modal.style.display = 'none';
            modal.style.visibility = 'hidden';
            modal.style.opacity = '0';
            modal.classList.add('hidden');
            
            // Restore body scroll
            document.body.style.overflow = '';
            
            console.log('✅ Video player closed');
        }

        // Test function to verify video player works
        function testVideoPlayer() {
            console.log('🧪 Testing video player...');
            playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'Test Video');
        }

        // Emergency function to force close modal if needed
        function forceCloseModal() {
            console.log('🚨 Force closing modal');
            const modal = document.getElementById('videoPlayerModal');
            if (modal) {
                modal.style.display = 'none !important';
                modal.style.visibility = 'hidden !important';
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }
    </script>
</body>
</html>
